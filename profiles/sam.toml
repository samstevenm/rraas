## About me

I'm Sam. I run [Diligent Services](https://diligentservices.io), the spiritual 
successor to/continuation of the construction company my
parents founded in 2002. We design and install lighting, control, AV, and networks for
homes and businesses in California, and then we stay on to keep them running.
The staying-on is the part I like best.

## How I got here

I grew up on my dad's job sites learning the trade. I talked my way into a
**FileMaker developer** job in high school, went back to construction, then
spent six years in the Navy boiling water a few hundred feet underwater by
splitting atoms, which is the Navy's roundabout way of making a submarine go.

After the Navy I did a stint on **SpaceX**'s Dragon, spent about six years at
**Lutron**, ran projects at **AHT Global**, and came home to the family
company.

## Why this page exists

1. Business cards are forgettable. 
