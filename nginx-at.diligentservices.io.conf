# at.diligentservices.io — the family "at" service, static.
# Install target: /etc/nginx/conf.d/at.diligentservices.io.conf on mm2.
# Docroot: /var/www/at.diligentservices.io/  (the builder's dist/ minus the apex
#   index.html). Layout: about.html (bare-host instructions), <name>/index.html
#   per person, 404.html, 50x.html.
#
#   at.diligentservices.io            -> 301 https://diligentservices.io/
#   <name>.at.diligentservices.io     -> <name>/index.html  (a person's page)
#   unknown <name>.at...         -> 301 to https://at.diligentservices.io/
#
# TLS — two lanes on purpose (see docs/ATPARTY.md):
#   * CLAIMED names (at.<apex> + each claimed <name>.at.<apex>): the
#     diligentservices.io SAN cert, auto-renewed via webroot. The builder emits the
#     exact list at dist/certbot-domains.txt; deploy re-runs certbot --expand.
#     When a profile flips to "claimed", ALSO add its name to the exact
#     server_name list below.
#   * EVERYTHING ELSE (wildcard DNS catches every label): the rfc2136-renewed
#     at-wildcard.diligentservices.io cert. This lane serves the UNCLAIMED stubs
#     (typed-in names work, but never appear in the SAN cert → no family
#     roster in CT logs) and 301s labels with no page to the instructions
#     page. If the wildcard cert lapses, unclaimed stubs + strangers'
#     redirects degrade; claimed pages stay on the auto-renewing SAN lane.

# phase 2: rickroll beacons. GET /roll.gif?who=<sub> from a profile page's
# first-visit pre-roll lands in a dedicated log; roll_aggregate.py (1-min
# timer) folds it into rickroll/leaderboard.json. empty_gif serves from
# memory — no file, no backend.
log_format atds_roll '$time_iso8601 $arg_who';

map $host $atperson {
    default "";
    "~^(?<label>[a-z0-9-]+)\.at\.diligentservices\.io$" $label;
}

# --- :80 — ACME + redirect to https, for the bare host AND every person ---
server {
    listen 80;
    listen [::]:80;
    server_name at.diligentservices.io ~^[a-z0-9-]+\.at\.diligentservices\.io$;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

# --- :443 bare at.diligentservices.io -> the instructions page ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name at.diligentservices.io;

    ssl_certificate /etc/letsencrypt/live/at.diligentservices.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/at.diligentservices.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/at.diligentservices.io;
    error_page 500 502 503 504 /50x.html;
    # shared /errors/ pages + 418/451 easter eggs (does not touch 404/50x here)
    # TODO(verify on box): dsio's error-eggs snippet name before enabling
    # include /etc/nginx/snippets/exmen-eggs-diligentservices.io.conf;

    # No public roster (Sam, 2026-08-21): the bare host is just a valid-TLS
    # landing that hands visitors to the marketing site.
    location / { return 301 https://diligentservices.io/; }
}

# --- :443 CLAIMED <name>.at.diligentservices.io -> that person's page ---
# Exact names beat the regex catch-all below. Keep this list in sync with the
# CLAIMED profiles in atparty/profiles/ only. Unclaimed stubs are deliberately
# NOT here (and not in the SAN cert): they're served by the wildcard catch-all
# below, so the family roster never leaks into Certificate Transparency logs.
# When a profile flips to "claimed", add its name here and re-run the deploy
# (which --expands the SAN cert from the builder's certbot-domains.txt).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sam.at.diligentservices.io connor.at.diligentservices.io pearl.at.diligentservices.io;

    ssl_certificate /etc/letsencrypt/live/at.diligentservices.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/at.diligentservices.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/at.diligentservices.io;
    error_page 500 502 503 504 /50x.html;
    # shared /errors/ pages + 418/451 easter eggs (does not touch 404/50x here)
    # TODO(verify on box): dsio's error-eggs snippet name before enabling
    # include /etc/nginx/snippets/exmen-eggs-diligentservices.io.conf;

    # /<person>/ -> that person's page; a name with no built page -> back to
    # the bare at. instructions page.
    # Page assets (photo, vCard) resolve relative to the person's subdir, so
    # $uri must be tried before the index (themyers served index.html for
    # every URI — its pages had no assets).
    location = /roll.gif {
        empty_gif;
        access_log /var/log/nginx/atds-roll.log atds_roll;
    }
    location ~* \.vcf$ {
        default_type text/vcard;
        add_header Content-Disposition 'attachment';
        try_files /$atperson$uri @nf;
    }
    location / {
        try_files /$atperson$uri /$atperson$uri/index.html /$atperson/index.html @nf;
    }
    location @nf { return 301 https://diligentservices.io/; }
}

# --- :443 catch-all <name>.at.diligentservices.io (wildcard-cert lane) ---
# Serves every label not in the exact list above, over the auto-renewed
# (rfc2136) wildcard cert: unclaimed stubs with a built page render normally
# when someone types the name; labels with no page 301 to the instructions
# page instead of a certificate warning (wildcard DNS resolves every label).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^[a-z0-9-]+\.at\.diligentservices\.io$;

    ssl_certificate /etc/letsencrypt/live/at-wildcard.diligentservices.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/at-wildcard.diligentservices.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/at.diligentservices.io;
    error_page 500 502 503 504 /50x.html;
    # shared /errors/ pages + 418/451 easter eggs (does not touch 404/50x here)
    # TODO(verify on box): dsio's error-eggs snippet name before enabling
    # include /etc/nginx/snippets/exmen-eggs-diligentservices.io.conf;

    # Page assets (photo, vCard) resolve relative to the person's subdir, so
    # $uri must be tried before the index (themyers served index.html for
    # every URI — its pages had no assets).
    location = /roll.gif {
        empty_gif;
        access_log /var/log/nginx/atds-roll.log atds_roll;
    }
    location ~* \.vcf$ {
        default_type text/vcard;
        add_header Content-Disposition 'attachment';
        try_files /$atperson$uri @nf;
    }
    location / {
        try_files /$atperson$uri /$atperson$uri/index.html /$atperson/index.html @nf;
    }
    location @nf { return 301 https://diligentservices.io/; }
}

# --- default_server: any hostname that is not an explicit vhost on this box
# (stray DNS, scanner SNI, a *.at label mid-deploy) 301s to the marketing
# site. Without this, nginx serves the first vhost alphabetically — which is
# 20.diligentservices.io, so pearl.at showed the Twenty CRM login before the
# at-lane vhost existed (Sam's 2026-08-21 report). Foreign hostnames on :443
# get the diligentservices.io cert (a mismatch warning is inherent to being
# the default; the 301 still lands for anyone who clicks through).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://diligentservices.io$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/diligentservices.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diligentservices.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://diligentservices.io$request_uri;
}
